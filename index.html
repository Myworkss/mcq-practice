<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MCQ Practice – Pakistan Studies</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#14202b;--muted:#5d6b78;--line:#dfe5ea;
  --brand:#0f766e;--brand-d:#0b5d57;--brand-soft:#e0f2f1;
  --ok:#15803d;--ok-bg:#dcfce7;--ok-line:#22c55e;
  --bad:#b91c1c;--bad-bg:#fee2e2;--bad-line:#ef4444;
  --warn-bg:#fef3c7;--warn:#92400e;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1419;--card:#18212a;--text:#e8eef3;--muted:#93a3b1;--line:#2a3743;
    --brand:#2dd4bf;--brand-d:#14b8a6;--brand-soft:#12312f;
    --ok:#86efac;--ok-bg:#12351f;--ok-line:#22c55e;
    --bad:#fca5a5;--bad-bg:#3b1517;--bad-line:#ef4444;
    --warn-bg:#3a2e0e;--warn:#fcd34d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:720px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:1.5rem;margin:6px 0 4px}
h2{font-size:1.1rem;margin:22px 0 10px}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;
  padding:9px 14px;font-size:.95rem;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tap{cursor:pointer;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.tap:active{transform:scale(.99)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ico{font-size:1.8rem;margin-right:12px}
.title{font-weight:650;font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.grid .card{margin:0}
.chip{display:inline-block;font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-d)}
@media (prefers-color-scheme:dark){.chip{color:var(--brand)}}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.practice{border-color:var(--bad-line);background:linear-gradient(0deg,var(--card),var(--card))}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}

/* quiz */
.qhead{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:5}
.qtop{display:flex;align-items:center;gap:10px}
.qtitle{flex:1;font-weight:650;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.88rem;cursor:pointer;color:var(--text)}
.score{display:flex;gap:12px;font-size:.88rem;margin-top:8px;color:var(--muted)}
.score b.g{color:var(--ok)}.score b.r{color:var(--bad)}
.qtext{font-size:1.15rem;font-weight:600;margin:14px 2px 16px;white-space:pre-wrap;word-break:break-word}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px;font:inherit;font-size:1.02rem;cursor:pointer;min-height:54px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .t{flex:1;padding-top:2px;word-break:break-word}
.opt:not([disabled]):active{border-color:var(--brand)}
.opt[disabled]{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.correct .l{background:var(--ok-line);color:#fff;border-color:var(--ok-line)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.wrong .l{background:var(--bad-line);color:#fff;border-color:var(--bad-line)}
.opt.dim{opacity:.65}
.note{border-radius:12px;padding:12px 14px;margin:4px 0 8px;font-size:.98rem}
.note.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.note.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.nav>div{max-width:720px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:1rem;font-weight:650;cursor:pointer;
  background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#042f2e}}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.big{font-size:3rem;font-weight:800;text-align:center;margin:10px 0 0}
.center{text-align:center}
.stack .btn{display:block;width:100%;margin-top:10px;flex:none}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;cursor:pointer;padding:8px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:16px 12px calc(24px + env(safe-area-inset-bottom))}
.modal{max-width:560px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px}
.modal h2{margin:0 0 4px}
.modal .qtext{font-size:1rem;margin:8px 0 12px}
.addrow{display:flex;gap:8px;margin:6px 0 14px}
.addrow input{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;padding:12px;font:inherit;font-size:1rem}
.addrow .btn{flex:none;padding:12px 16px}
.acts{display:flex;gap:10px}
.rm{flex:none;border:0;background:none;color:var(--bad);font-size:.85rem;cursor:pointer;padding:6px}
.optrow{display:flex;align-items:flex-start;gap:4px}
.optrow .opt{flex:1}
</style>
</head>

  if(!S[sid]) S[sid] = { ans:{}, pos:{}, wrong:{}, keys:{}, edits:{} };
  if(!S[sid].keys) S[sid].keys = {};

  var s = st(sid), e = s.edits[id];
  if(e && e.key!=null) return e.key;
  var a = subj(sid).data[id].a;
  if(a>=0) return a;
  var u = s.keys[id];
  return (u==null) ? -1 : u;
}

function optsOf(sid, id){
  var e = st(sid).edits[id];

}

}

        done? h('span',{class:'chip ok'},['Done']) : (x.answered? h('span',{class:'chip'},['In progress']) : null)]),
      h('div',{class:'meta'},['Q '+t.start+' \u2013 '+t.end+' \u00B7 '+x.total+' MCQs']),
      bar(x.answered/x.total),
      h('div',{class:'stats'},[
        h('span',{class:'meta'},[x.answered+'/'+x.total+' answered']),
        x.answered? h('span',{class:'chip ok'},['\u2713 '+x.correct]) : null,
        x.wrong? h('span',{class:'chip bad'},['\u2717 '+x.wrong]) : null
      ])
    ]));
  });
  nodes.push(grid);
  mount(nodes);
}

/* ---------- Quiz ---------- */
var Q = null;
var LETTERS='ABCDEFGH';
function openQuiz(sid, mode, testNo){
  var sub=subj(sid); if(!sub) return viewHome();
  var s=st(sid), ids, title, i=0;
  if(mode==='test'){
    var t=tests(sub).filter(function(x){return x.no===testNo;})[0];
    if(!t) return viewSubject(sid);
    ids=t.ids; title=sub.name+' \u2013 Test '+t.no;
    i=Math.min(Math.max(s.pos[t.no]||0,0),ids.length-1);
  } else {
    ids=Object.keys(s.wrong).map(Number).sort(function(a,b){return a-b;});
    title='Again Practice';
  }
  Q={sid:sid,sub:sub,mode:mode,testNo:testNo,ids:ids,i:i,title:title,sess:{},done:false};
  if(mode==='practice' && !ids.length){ return viewEmptyPractice(); }
  viewQuiz();
}
function answerOf(id){
  return Q.mode==='test' ? st(Q.sid).ans[id] : Q.sess[id];
}
function pick(k){
  var id=Q.ids[Q.i], s=st(Q.sid), key=keyOf(Q.sid,id);
  if(answerOf(id)!=null) return;
  if(key<0){ s.keys[id]=k; key=k; }   /* no answer key in data: the user's choice is saved as the correct answer */
  if(Q.mode==='test'){
    s.ans[id]=k;
    if(k!==key) s.wrong[id]=1;
  } else {
    Q.sess[id]=k;
    if(k===key) delete s.wrong[id];
  }
  save();
  viewQuiz(true);
}
function changeKey(){
  var id=Q.ids[Q.i], s=st(Q.sid);
  if(!confirm('Clear the saved correct answer for this question and choose again?')) return;
  delete s.keys[id]; if(s.edits[id]) delete s.edits[id].key;
  delete s.ans[id]; delete s.wrong[id]; delete Q.sess[id];
  save(); viewQuiz(true);
}
function move(d){
  var n=Q.i+d;
  if(n<0) return;
  if(n>=Q.ids.length){ Q.done=true; if(Q.mode==='test'){ st(Q.sid).pos[Q.testNo]=0; save(); } return viewResult(); }
  Q.i=n;
  if(Q.mode==='test'){ st(Q.sid).pos[Q.testNo]=Q.i; save(); }
  viewQuiz();
}
function jump(){
  var v=prompt('Go to question number (1\u2013'+Q.ids.length+')');
  if(v==null) return;
  var n=parseInt(v,10);
  if(isNaN(n)||n<1||n>Q.ids.length) return;
  Q.i=n-1;
  if(Q.mode==='test'){ st(Q.sid).pos[Q.testNo]=Q.i; save(); }
  viewQuiz();
}
function tally(){
  var c=0,w=0,a=0;
  Q.ids.forEach(function(id){
    var v=answerOf(id); if(v==null) return; a++;
    var k=keyOf(Q.sid,id); if(k<0) return;
    if(v===k) c++; else w++;
  });
  return {c:c,w:w,a:a};
}
function viewQuiz(keepScroll){
  var id=Q.ids[Q.i], item=Q.sub.data[id], ans=answerOf(id), tl=tally(), key=keyOf(Q.sid,id), userKey=(item.a<0);
  var y=window.scrollY;
  var allOpts=optsOf(Q.sid,id);
  var opts=allOpts.map(function(text,idx){
    var cls='opt', dis=false;
    if(ans!=null){
      dis=true;
      if(key>=0){
        if(idx===key) cls+=' correct';
        else if(idx===ans) cls+=' wrong';
        else cls+=' dim';
      } else if(idx===ans) cls+=' dim';
    }
    return h('button',{class:cls,disabled:dis,on:{click:function(){pick(idx);}}},[
      h('span',{class:'l'},[LETTERS[idx]||'?']), h('span',{class:'t'},[text])
    ]);
  });
  var note=null;
  if(ans==null && key<0){
    note=h('div',{class:'note warn'},['\u26A0 No answer key is available for this question. Select the option you know is correct. It will be saved as the correct answer.']);
  } else if(ans!=null){
    if(ans===key) note=h('div',{class:'note ok'},[userKey?'\u2713 Saved as the correct answer.':'\u2713 Correct!']);
    else note=h('div',{class:'note bad'},['\u2717 Wrong. Correct answer: ',h('b',null,[LETTERS[key]+'. '+allOpts[key]])]);
    if(Q.mode==='test' && ans!==key)
      note.appendChild(h('div',{class:'meta',style:'margin-top:4px;color:inherit;opacity:.85'},['Added to Again Practice.']));
    if(Q.mode==='practice' && ans===key)
      note.appendChild(h('div',{class:'meta',style:'margin-top:4px;color:inherit;opacity:.85'},['Removed from Again Practice.']));
  }
  var ed=st(Q.sid).edits[id], edited=!!(ed&&(ed.key!=null||(ed.extra&&ed.extra.length)));
  var editBtn=h('button',{class:'link',on:{click:openEditor}},['\u270E Edit options / correct answer'+(edited?' (edited)':'')]);
  var fix = (userKey && key>=0 && !(ed&&ed.key!=null)) ? h('button',{class:'link',on:{click:changeKey}},['Wrong saved answer? Choose again']) : null;
  var last = Q.i===Q.ids.length-1;
  mount([
    h('div',{class:'qhead'},[
      h('div',{class:'qtop'},[
        h('button',{class:'back',on:{click:function(){go('#/'+Q.sid);}}},['\u2190']),
        h('div',{class:'qtitle'},[Q.title]),
        h('button',{class:'counter',on:{click:jump}},[(Q.i+1)+' / '+Q.ids.length])
      ]),
      bar((Q.i+1)/Q.ids.length),
      h('div',{class:'score'},[
        h('span',null,['\u2713 ',h('b',{class:'g'},[tl.c])]),
        h('span',null,['\u2717 ',h('b',{class:'r'},[tl.w])]),
        h('span',null,['Answered ',tl.a+'/'+Q.ids.length])
      ])
    ]),
    h('div',{class:'qtext'},[(Q.mode==='test'? (Q.sub.per*(Q.testNo-1)+Q.i+1)+'. ' : '')+item.q]),
    h('div',null,opts),
    note,
    editBtn,
    fix,
    h('div',{class:'nav'},[h('div',null,[
      h('button',{class:'btn alt',disabled:Q.i===0,on:{click:function(){move(-1);}}},['\u2190 Previous']),
      h('button',{class:'btn',on:{click:function(){move(1);}}},[last?'Finish':'Next \u2192'])
    ])])
  ]);
  if(keepScroll) window.scrollTo(0,y);
}

/* ---------- Editor: add options / fix the correct answer ---------- */
function reconcile(id){
  var s=st(Q.sid), key=keyOf(Q.sid,id), n=optsOf(Q.sid,id).length;
  if(s.ans[id]!=null && s.ans[id]>=n){ delete s.ans[id]; delete s.wrong[id]; }
  if(Q.sess[id]!=null && Q.sess[id]>=n) delete Q.sess[id];
  var a=s.ans[id];
  if(a!=null){
    if(key<0) delete s.wrong[id];
    else if(a===key) delete s.wrong[id];
    else s.wrong[id]=1;
  }
  var sa=Q.sess[id];
  if(sa!=null && key>=0 && sa===key) delete s.wrong[id];
}
function openEditor(){
  var id=Q.ids[Q.i], s=st(Q.sid), item=Q.sub.data[id], base=item.o;
  var ex=((s.edits[id]&&s.edits[id].extra)||[]).slice();
  var sel=keyOf(Q.sid,id), typed='';
  var ov=h('div',{class:'ov'});
  document.body.appendChild(ov);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  function draw(){
    ov.innerHTML='';
    var all=base.concat(ex);
    var box=h('div',{class:'modal'},[
      h('h2',null,['Edit MCQ']),
      h('p',{class:'sub'},['Tap an option to mark it as the correct answer. Add a missing option below.']),
      h('div',{class:'qtext'},[item.q])
    ]);
    all.forEach(function(text,i){
      var row=h('div',{class:'optrow'},[
        h('button',{class:'opt'+(sel===i?' correct':''),on:{click:function(){sel=i;typed=inp.value;draw();}}},[
          h('span',{class:'l'},[LETTERS[i]||'?']),h('span',{class:'t'},[text])
        ])
      ]);
      if(i>=base.length){
        row.appendChild(h('button',{class:'rm',on:{click:function(){
          ex.splice(i-base.length,1);
          if(sel===i) sel=-1; else if(sel>i) sel--;
          typed=inp.value; draw();
        }}},['Remove']));
      }
      box.appendChild(row);
    });
    if(all.length<LETTERS.length){
      var inp=h('input',{type:'text',placeholder:'Add a new option...',maxlength:'200'});
      inp.value=typed;
      var add=function(){
        var v=inp.value.trim(); if(!v) return;
        ex.push(v); sel=base.length+ex.length-1; typed=''; draw();
      };
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') add(); });
      box.appendChild(h('div',{class:'addrow'},[inp,h('button',{class:'btn',on:{click:add}},['Add'])]));
    } else {
      var inp={value:typed};
    }
    var note=(sel<0)? h('div',{class:'note warn'},['No correct answer selected yet.']) : null;
    if(note) box.appendChild(note);
    box.appendChild(h('div',{class:'acts'},[
      h('button',{class:'btn alt',on:{click:close}},['Cancel']),
      h('button',{class:'btn',on:{click:function(){
        var v=(inp.value||'').trim();
        if(v && all.length<LETTERS.length && confirm('You typed an option but did not tap Add. Add "'+v+'" as an option?')){
          ex.push(v); if(sel<0) sel=base.length+ex.length-1;
        }
        var e=s.edits[id]||(s.edits[id]={});
        if(ex.length) e.extra=ex; else delete e.extra;
        if(sel>=0){ e.key=sel; delete s.keys[id]; } else { delete e.key; }
        if(e.key==null && !e.extra) delete s.edits[id];
        reconcile(id); save(); close(); viewQuiz(true);
      }}},['Save'])
    ]));
    box.appendChild(h('div',{class:'center'},[
      h('button',{class:'link',on:{click:function(){
        if(!confirm('Remove all your edits (added options and correct answer) for this question?')) return;
        delete s.edits[id]; delete s.keys[id];
        reconcile(id); save(); close(); viewQuiz(true);
      }}},['Reset this question to the original'])
    ]));
    ov.appendChild(box);
  }
  draw();
}
function viewResult(){
  var tl=tally(), total=Q.ids.length, pct=total? Math.round(tl.c/total*100):0;
  var wc=wrongCount(Q.sid);
  var box=h('div',{class:'card center stack'},[
    h('div',{class:'meta'},[Q.title]),
    h('div',{class:'big'},[tl.c+' / '+total]),
    h('div',{class:'sub'},[pct+'% correct \u00B7 '+tl.w+' wrong \u00B7 '+(total-tl.a)+' unanswered'])
  ]);
  if(wc) box.appendChild(h('button',{class:'btn',on:{click:function(){go('#/'+Q.sid+'/practice');}}},['Practice wrong MCQs ('+wc+')']));
  box.appendChild(h('button',{class:'btn alt',on:{click:function(){Q.i=0;Q.done=false;viewQuiz();}}},['Review from start']));
  box.appendChild(h('button',{class:'btn alt',on:{click:function(){go('#/'+Q.sid);}}},['Back to tests']));
  if(Q.mode==='test'){
    box.appendChild(h('button',{class:'link',on:{click:function(){
      if(!confirm('Reset all answers for this test? Its wrong MCQs will also be removed from Again Practice.')) return;
      resetTest(); viewQuiz();
    }}},['Reset this test']));
  }
  mount([h('h1',null,['Finished']), box]);
}
function resetTest(){
  var s=st(Q.sid);
  Q.ids.forEach(function(id){ delete s.ans[id]; delete s.wrong[id]; });
  s.pos[Q.testNo]=0; Q.i=0; Q.done=false; save();
}
function viewEmptyPractice(){
  mount([
    h('div',{class:'top'},[h('button',{class:'back',on:{click:function(){go('#/'+Q.sid);}}},['\u2190 Back'])]),
    h('div',{class:'card center'},[
      h('div',{class:'big'},['\uD83C\uDF89']),
      h('div',{class:'title'},['Nothing to practice']),
      h('p',{class:'sub'},['Questions you answer wrongly in the tests will appear here.'])
    ])
  ]);
}

/* ---------- Router ---------- */
function route(){
  var p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length) return viewHome();
  if(!subj(p[0])) return viewHome();
  if(p.length===1) return viewSubject(p[0]);
  if(p[1]==='test') return openQuiz(p[0],'test',parseInt(p[2],10));
  if(p[1]==='practice') return openQuiz(p[0],'practice');
  viewSubject(p[0]);
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function(e){
  if(!Q || !document.querySelector('.qtext') || document.querySelector('.ov')) return;
  var k=e.key.toUpperCase(), i=LETTERS.indexOf(k);
  if(k.length===1 && i>=0 && i<optsOf(Q.sid,Q.ids[Q.i]).length) pick(i);
  else if(e.key==='ArrowRight') move(1);
  else if(e.key==='ArrowLeft') move(-1);
});
route();
})();
</script>
</body>
